apis:
- name: Tour Amigo Partner API
  description: >-
    Tour Amigo's bookable two-way partner API powers its API-powered channel
    manager. Operators expose tours, availability, and bookings either
    directly to their own distribution partners or through Tour Amigo's
    partner network of travel agents and OTAs (GetYourGuide, TourRadar,
    Tourhub, and others). Access is partner-gated - api.touramigo.com
    redirects all paths to a login page and no public API reference or
    machine-readable spec is published.

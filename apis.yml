aid: touramigo
name: TourAmigo
description: >-
  Tour Amigo is a cloud-based booking and operations platform for multi-day
  tour operators, destination management companies (DMCs), and river and
  expedition cruise operators. The platform covers itinerary building,
  supplier and contract management, direct online selling, agent and customer
  portals, financial management with native Xero integration, and an
  API-powered channel manager that distributes tours to partners such as
  GetYourGuide, TourRadar, and Tourhub. Backed by 500 Global, with core
  markets in Australia, New Zealand, and Europe.
